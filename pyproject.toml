[project]
name = "frontendslm"
version = "0.1.0"
description = "Reproducible dual-SLM frontend research on Modal"
requires-python = ">=3.11,<3.14"
dependencies = ["modal>=1.2,<2", "pydantic>=2.11,<3", "huggingface-hub>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontendslm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
